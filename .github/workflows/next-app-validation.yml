name: Next.js foundation validation

on:
  pull_request:
    paths:
      - "next-app/**"
      - ".github/workflows/next-app-validation.yml"
  push:
    branches:
      - main
    paths:
      - "next-app/**"
      - ".github/workflows/next-app-validation.yml"

permissions:
  contents: read

concurrency:
  group: next-app-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build Next.js app
        run: npm run build
      - name: Build Cloudflare Worker output
        run: npx opennextjs-cloudflare build
