name: Apply isolated preview D1 migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avidezuri-preview-d1-migrations
  cancel-in-progress: false

jobs:
  migrate-preview:
    runs-on: ubuntu-latest
    environment: avidezuri-next-preview
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify preview credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4.157.0
      - name: Apply migrations to the isolated preview database only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply avidezuri-preview --remote --config wrangler.preview-migrations.jsonc
