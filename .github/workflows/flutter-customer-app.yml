name: Customer Android app checks

on:
  pull_request:
    paths:
      - "mobile/customer_app/**"
      - ".github/workflows/flutter-customer-app.yml"
  push:
    branches:
      - "feature/customer-app-catalogue"
    paths:
      - "mobile/customer_app/**"
      - ".github/workflows/flutter-customer-app.yml"

jobs:
  customer-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/customer_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format Dart sources before validation
        run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Generate Android platform project
        run: flutter create --platforms=android --org=com.avidezuri --project-name=customer .
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: avidezuri-customer-android-debug
          path: mobile/customer_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
